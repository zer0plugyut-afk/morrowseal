[package]
name = "morrowseal-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Morrowseal vault registry on NEAR: stores only commitments and check-in deadlines, and asks the OutLayer enclave to release a vault to its heirs."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.17", features = ["legacy"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
