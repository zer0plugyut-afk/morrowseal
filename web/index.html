      <h1>Morrowseal</h1>
      <p>A private inheritance vault on NEAR testnet. Your browser encrypts files and a letter; the key and heir list are sealed to an OutLayer TEE enclave. While you keep checking in, nothing can be opened. If you stop, the vault is released by the NEAR contract morrowseal-vault.testnet, and each heir opens it by signing in with the email you named. Only a hash, an IPFS address, an heir count and times are stored on chain. This app needs JavaScript.</p>
